<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dezembro de 2009 - Portfolio Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <h2>Dezembro / 2009</h2>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Dom</th>
                    <th>Seg</th>
                    <th>Ter</th>
                    <th>Qua</th>
                    <th>Qui</th>
                    <th>Sex</th>
                    <th>Sáb</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="other-month">29</td>
                    <td class="other-month">30</td>
                    <td>1</td>
                    <td>2</td>
                    <td>3</td>
                    <td>4</td>
                    <td>5</td>
                </tr>
                <tr>
                    <td>6</td>
                    <td>7</td>
                    <td>8</td>
                    <td class="birthday">9</td>
                    <td>10</td>
                    <td>11</td>
                    <td>12</td>
                </tr>
                <tr>
                    <td>13</td>
                    <td>14</td>
                    <td>15</td>
                    <td>16</td>
                    <td>17</td>
                    <td>18</td>
                    <td>19</td>
                </tr>
                <tr>
                    <td>20</td>
                    <td>21</td>
                    <td>22</td>
                    <td>23</td>
                    <td>24</td>
                    <td class="holiday">25</td>
                    <td>26</td>
                </tr>
                <tr>
                    <td>27</td>
                    <td>28</td>
                    <td>29</td>
                    <td>30</td>
                    <td class="holiday">31</td>
                    <td class="other-month">1</td>
                    <td class="other-month">2</td>
                </tr>
            </tbody>
        </table>

        <div class="legend">
            <div class="legend-item">
                <span class="legend-indicator birthday-ind"></span>
                <span>09 - Meu Aniversário</span>
            </div>
            <div class="legend-item">
                <span class="legend-indicator holiday-ind"></span>
                <span>25 - Natal</span>
            </div>
            <div class="legend-item">
                <span class="legend-indicator holiday-ind"></span>
                <span>31 - Véspera de Ano Novo</span>
            </div>
        </div>
    </div>

</body>
</html>
